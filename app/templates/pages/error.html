{% extends "layouts/base.html" %}

{% block title %}{{ status_code }} - {{ error_title }} | {{ app_name }}{% endblock %}
{% block meta_description %}{{ error_message }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container">
    <div class="error-panel">
      <p class="eyebrow mb-3">Error {{ status_code }}</p>
      <h1>{{ error_title }}</h1>
      <p>{{ error_message }}</p>
      <a class="btn btn-dark" href="/">Back to homepage</a>
    </div>
  </div>
</section>
{% endblock %}
