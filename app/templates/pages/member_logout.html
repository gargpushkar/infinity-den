{% extends "layouts/base.html" %}
{% from "components/form_fields.html" import form_alert %}

{% block title %}Sign out | {{ app_name }}{% endblock %}

{% block content %}
<section class="member-page">
  <div class="container">
    <div class="member-panel">
      <h1>Sign out?</h1>
      {{ form_alert(error) }}
      <form class="member-form" method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="btn btn-primary member-submit" type="submit">Sign out</button>
      </form>
      <p class="member-switch"><a href="/">Back to the homepage</a></p>
    </div>
  </div>
</section>
{% endblock %}
