{% for rail in article_rails | default([], true) %}
  <section
    class="content-section rail-section"
    id="rail-{{ rail.key }}"
    aria-labelledby="railTitle{{ rail.key }}"
  >
    <div class="rail-heading">
      <div>
        <p class="eyebrow mb-2">{{ rail.title }}</p>
        <h2 id="railTitle{{ rail.key }}">{{ rail.subtitle }}</h2>
      </div>

      <div class="rail-controls">
        <a class="section-link" href="{{ rail.url }}">View all</a>
        <div class="rail-arrows" data-rail-arrows hidden>
          <button type="button" data-rail-prev aria-label="Scroll {{ rail.title }} backwards">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 5-7 7 7 7"></path>
            </svg>
          </button>
          <button type="button" data-rail-next aria-label="Scroll {{ rail.title }} forwards">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 5 7 7-7 7"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div
      class="rail-track"
      data-rail-track
      tabindex="0"
      role="group"
      aria-label="{{ rail.title }} articles, scrollable"
    >
      {% for article in rail.articles %}
        <div class="rail-item">
          {% include "components/article_card.html" %}
        </div>
      {% endfor %}
    </div>
  </section>
{% endfor %}
