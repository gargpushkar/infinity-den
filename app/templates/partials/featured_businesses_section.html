{% if featured_businesses | default([], true) %}
  <section class="content-section business-section" id="featuredBusinesses" aria-labelledby="featuredBusinessesTitle" data-reveal>
    <div class="rail-heading">
      <div>
        <p class="eyebrow mb-2">
          Featured businesses
          <span class="rail-paid-flag">Partners</span>
        </p>
        <h2 id="featuredBusinessesTitle">Places and people we work with.</h2>
      </div>
    </div>

    <div class="business-grid">
      {% for business in featured_businesses %}
        <div data-reveal-child>
          {% include "components/business_card.html" %}
        </div>
      {% endfor %}
    </div>
  </section>
{% endif %}
