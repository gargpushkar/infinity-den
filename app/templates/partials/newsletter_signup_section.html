<section class="content-section newsletter-section" id="newsletterSignup" aria-labelledby="newsletterSignupTitle">
  <div class="newsletter-panel">
    <div class="newsletter-copy">
      <p class="eyebrow mb-2">Newsletter</p>
      <h2 id="newsletterSignupTitle">Get the editorial signal without the dashboard noise.</h2>
      <p>One concise briefing on publishing systems, search momentum, and contributor workflows.</p>
    </div>

    <form class="newsletter-form" action="#" method="post" data-newsletter-form>
      <label class="visually-hidden" for="newsletterEmail">Email address</label>
      <div class="newsletter-form-row">
        <input
          class="form-control newsletter-input"
          id="newsletterEmail"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="reader@example.com"
          required
        >
        <button class="btn btn-dark newsletter-submit" type="submit">Subscribe</button>
      </div>
      <p class="newsletter-note" data-newsletter-message>Weekly. Useful. Easy to leave.</p>
    </form>
  </div>
</section>
