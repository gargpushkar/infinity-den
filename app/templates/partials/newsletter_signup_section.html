<section class="content-section newsletter-section" id="newsletterSignup" aria-labelledby="newsletterSignupTitle" data-reveal>
  <div class="newsletter-panel" data-reveal-child>
    <div class="newsletter-copy">
      <p class="eyebrow mb-2">Newsletter</p>
      <h2 id="newsletterSignupTitle">The week&rsquo;s best, in one email.</h2>
      <p>The week&rsquo;s most interesting ideas, questions, and stories. One send a week, nothing else.</p>
    </div>

    <form class="newsletter-form" action="/api/newsletter/subscribe" method="post" data-newsletter-form>
      <label class="visually-hidden" for="newsletterEmail">Email address</label>
      <div class="newsletter-form-row">
        <input
          class="form-control newsletter-input"
          id="newsletterEmail"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="reader@example.com"
          required
        >
        <button class="btn btn-dark newsletter-submit" type="submit">Subscribe</button>
      </div>
      <p class="newsletter-note" data-newsletter-message role="status">Weekly. No spam. Unsubscribe in one click.</p>
    </form>
  </div>
</section>
