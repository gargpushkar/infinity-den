{# Save / Saved toggle for a piece. A plain form, so it works without JavaScript.
   Expects `article`, `is_saved`, `signed_in`, `csrf_token`; `save_next` sets where it returns to, `save_label` overrides the text. #}
{% if signed_in %}
  <form class="save-form" method="post" action="/articles/{{ article.slug }}/bookmark">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="action" value="{{ 'remove' if is_saved else 'save' }}">
    {% if save_next %}<input type="hidden" name="next" value="{{ save_next }}">{% endif %}
    <button class="save-button{% if is_saved %} is-saved{% endif %}" type="submit" aria-pressed="{{ 'true' if is_saved else 'false' }}">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z" fill="{{ 'currentColor' if is_saved else 'none' }}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      {{ save_label|default("Saved" if is_saved else "Save") }}
    </button>
  </form>
{% else %}
  <a class="save-button" href="/login?next=/articles/{{ article.slug }}">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    Save
  </a>
{% endif %}
